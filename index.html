<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>白西県 RP</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            text-align: center;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            margin-top: 10px;
            font-size: 18px;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .hero {
            background: white;
            padding: 60px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #666;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 35px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .card h3 {
            margin-top: 0;
        }

        footer {
            margin-top: 60px;
            padding: 30px;
            background: #1f2937;
            color: white;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 32px;
            }

            .hero h2 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>白西県 RP</h1>
    <p>日本の街を舞台にしたRoblox RPゲーム</p>
</header>

<main>

    <section class="hero">
        <h2>白西県へようこそ</h2>

        <p>
            鉄道、道路、街の中で自由にRPを楽しもう！
        </p>

        <a class="button" href="#">
            🎮 ゲームをプレイ
        </a>
    </section>

    <section class="cards">

        <div class="card">
            <h3>🚆 鉄道</h3>
            <p>
                白西県を走る鉄道を紹介します。
            </p>
        </div>

        <div class="card">
            <h3>📜 ルール</h3>
            <p>
                ゲームを遊ぶ前にルールを確認しましょう。
            </p>
        </div>

        <div class="card">
            <h3>📰 更新情報</h3>
            <p>
                最新アップデート情報を掲載します。
            </p>
        </div>

    </section>

</main>

<footer>
    © 白西県 RP
</footer>

</body>
</html>
